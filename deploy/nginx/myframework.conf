server {
    listen 80;
    server_name _;   # заменить на домен или IP

    client_max_body_size 200M;

    access_log /var/log/nginx/myframework_access.log;
    error_log  /var/log/nginx/myframework_error.log;

    # Статика Flask отдаётся напрямую через Nginx
    location /static/ {
        alias /home/deploy/apps/myframework/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Загруженные файлы
    location /uploads/ {
        alias /home/deploy/apps/myframework/uploads/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Всё остальное — проксируем на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}